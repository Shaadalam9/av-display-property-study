[project]
name = "av-display-property-study"
version = "0.1.0"
description = "Study to select which visual properties of AV explanation displays to personalise"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pillow>=11.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Only for extract_geometry.py (detection and tracking on a source clip). Pinned to a
# release that is at least two weeks old; lap is ByteTrack's assignment step, which
# ultralytics would otherwise pip-install mid-run.
extract = [
    "ultralytics==8.4.174",
    "lap>=0.5.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
